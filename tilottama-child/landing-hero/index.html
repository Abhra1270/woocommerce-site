<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tilo Hero Landing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="tilo-hero-demo">
    <main class="tilo-hero" aria-labelledby="tilo-hero-title">
        <div class="tilo-hero__device" role="region" aria-label="Trending shoes carousel">
            <div class="tilo-hero__slider swiper" aria-live="polite">
                <div class="swiper-wrapper">
                    <article class="tilo-hero__slide swiper-slide" data-caption="Airy pastel sneaker" data-slide-index="0" aria-roledescription="slide">
                        <picture>
                            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=900&q=80" alt="Soft pastel sneaker on a color block background" loading="lazy">
                        </picture>
                    </article>
                    <article class="tilo-hero__slide swiper-slide" data-caption="Studio close-up" data-slide-index="1" aria-roledescription="slide">
                        <picture>
                            <img src="https://images.unsplash.com/photo-1528701800489-20be3c6c51f4?auto=format&fit=crop&w=900&q=80" alt="Minimalist sneaker photographed in studio lighting" loading="lazy">
                        </picture>
                    </article>
                    <article class="tilo-hero__slide swiper-slide" data-caption="Sneaker in motion" data-slide-index="2" aria-roledescription="slide">
                        <video class="tilo-hero__video" preload="metadata" muted playsinline loop>
                            <source src="https://cdn.coverr.co/videos/coverr-stylish-shoes-1080p.mp4" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </article>
                </div>
                <div class="tilo-hero__pagination swiper-pagination" aria-label="Slide pagination"></div>
            </div>
        </div>

        <section class="tilo-hero__card" aria-describedby="tilo-hero-progress">
            <h1 id="tilo-hero-title">Follow Latest Style Shoes to follow the trend going on</h1>
            <p>Discover curated edits of the freshest footwear, styled to keep you ahead of every season and occasion.</p>
            <div id="tilo-hero-progress" class="tilo-hero__progress" role="img" aria-label="Carousel progress indicator"></div>
        </section>

        <div class="tilo-hero__action" role="group" aria-label="Carousel controls">
            <button class="tilo-hero__next" type="button">
                <span class="tilo-hero__next-label">Next</span>
                <span class="tilo-hero__next-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false" role="img" aria-hidden="true">
                        <path d="M12 4l1.41 1.41L9.83 9H20v2H9.83l3.58 3.59L12 16l-6-6 6-6z" />
                    </svg>
                </span>
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="app.js" defer></script>
</body>
</html>
